name = "Ayu Dark Contrast"
appearance = "dark"

[ui]
accent = "#e6b450"
accent_strong = "#ffcb8f"
background = "#0a0a0a"
border = "#262626"
border_strong = "#3a3a3a"
border_variant = "#1c1c1c"
cursor = "#e6b450"
element = "#1c1c1c"
# A darker red than `error`, which keeps white text at only 2.9:1.
error_fill = "#cf3341"
# The accent composited at `1f` and `38`, with every syntax role at 4.5:1: see docs/adr/0002-find-match-contrast.md.
find = "#251f13"
find_active = "#3a2f19"
find_active_border = "#e6b450"
find_border = "#e6b45066"
find_terminal = "#e6b4501f"
find_terminal_active = "#e6b45038"
foreground = "#f3efe3"
highlight = "#202020"
hover = "#141414"
indent = "#3a3a3a"
indent_active = "#8a8a8a"
invisible = "#3a3a3a"
muted = "#a3a3a3"
panel = "#111111"
quiet = "#8a8a8a"
# ayu's selection blue at 30% rather than its 25%, so a selection stands out on the neutral black.
selection = "#163054"
# Translucent, compositing to `selection` over the background.
selection_overlay = "#2d78e058"
accents = ["#59c2ff", "#d2a6ff", "#e6b450", "#95e6cb", "#aad94c", "#f07178"]

# The normal ANSI colours, so their shimmers can take the bright ones; `error` is ayu's syntax red, not its dimmer `#d95757`.
[status]
conflict = "#e89d37"
created = "#70bf56"
deleted = "#f26d78"
error = "#f07178"
hidden = "#8a8a8a"
hint = "#8a8a8a"
ignored = "#8a8a8a"
info = "#17acf2"
modified = "#73b8ff"
predictive = "#8a8a8a"
renamed = "#73b8ff"
success = "#aad94c"
unreachable = "#8a8a8a"
warning = "#e89d37"

# black, red, green, yellow, blue, magenta, cyan, white
# Black and bright black are greys, since ayu's `#0a0000` disappears on this background; white is the foreground.
[ansi]
normal = ["#1c1c1c", "#e6495a", "#97c142", "#e89d37", "#17acf2", "#c385fe", "#84ceb5", "#f3efe3"]
bright = ["#8a8a8a", "#f07178", "#aad94c", "#ffb454", "#59c2ff", "#d2a6ff", "#95e6cb", "#ffffff"]

# `_system` roles colour symbols from outside the project, where an editor tells them apart.
[syntax]
attribute = "#e6c08a"
# ayu's `#5a6673` is 3.4:1 here, and `quiet` falls below 4.5:1 on the selection.
comment = "#a3a3a3"
# Not in ayu: one step brighter than `comment`.
comment_emphasized = "#bdbdbd"
constant = "#d2a6ff"
function = "#ffb454"
function_system = "#ffcb8f"
keyword = "#ff8f40"
link = "#39bae6"
literal = "#d2a6ff"
namespace = "#e6c08a"
number = "#d2a6ff"
plain = "#f3efe3"
punctuation = "#a3a3a3"
regex = "#95e6cb"
string = "#aad94c"
tag = "#39bae6"
type = "#59c2ff"
type_parameter = "#85d0ff"
type_system = "#39bae6"
variable = "#f3efe3"
