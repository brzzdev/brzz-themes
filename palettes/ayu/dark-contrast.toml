name = "Ayu Dark Contrast"
appearance = "dark"

[ui]
accent = "#e6b450"
accent_strong = "#ffcb8f"
background = "#0a0a0a"
border = "#262626"
border_strong = "#3a3a3a"
border_variant = "#1c1c1c"
cursor = "#e6b450"
element = "#1c1c1c"
# A darker red than `error`, which keeps white text at only 3.9:1.
error_fill = "#cf3341"
# ayu's find fills; the active match is dimmed from its `#4c4126` until every colour drawn among code reaches 4.5:1: see docs/adr/0002-find-match-contrast.md.
find = "#2b2618"
find_active = "#3b301a"
find_active_border = "#e6b450"
find_border = "#e6b45066"
find_terminal = "#4c412680"
find_terminal_active = "#e6b45039"
foreground = "#f3efe3"
highlight = "#202020"
hover = "#141414"
indent = "#3a3a3a"
indent_active = "#8a8a8a"
invisible = "#3a3a3a"
muted = "#a3a3a3"
panel = "#111111"
quiet = "#8a8a8a"
# ayu's selection, `#3388ff` at 25%.
selection = "#142a47"
# Translucent, compositing to `selection` over the background.
selection_overlay = "#3388ff40"
accents = ["#59c2ff", "#d2a6ff", "#e6b450", "#95e6cb", "#aad94c", "#f07178"]

[status]
conflict = "#d95757"
created = "#70bf56"
deleted = "#f26d78"
error = "#d95757"
hidden = "#8a8a8a"
# Grey text drawn in code (hints, predictions, unused code) takes the comment grey: `quiet` falls below 4.5:1 on the selection.
hint = "#a3a3a3"
ignored = "#8a8a8a"
info = "#39bae6"
modified = "#73b8ff"
predictive = "#a3a3a3"
renamed = "#73b8ff"
success = "#70bf56"
unreachable = "#a3a3a3"
warning = "#e6b450"

# black, red, green, yellow, blue, magenta, cyan, white
# Black and bright black are greys, since ayu's `#0a0000` disappears on this background.
[ansi]
normal = ["#1c1c1c", "#e6495a", "#97c142", "#e89d37", "#17acf2", "#c385fe", "#84ceb5", "#ffffff"]
bright = ["#8a8a8a", "#f07178", "#aad94c", "#ffb454", "#59c2ff", "#d2a6ff", "#95e6cb", "#ffffff"]

# `_system` roles colour symbols from outside the project, where an editor tells them apart.
[syntax]
attribute = "#e6c08a"
# ayu's `#5a6673` is 3.4:1 here, and `quiet` falls below 4.5:1 on the selection.
comment = "#a3a3a3"
# Not in ayu: one step brighter than `comment`.
comment_emphasized = "#bdbdbd"
constant = "#d2a6ff"
function = "#ffb454"
function_system = "#ffcb8f"
keyword = "#ff8f40"
link = "#39bae6"
literal = "#d2a6ff"
namespace = "#e6c08a"
number = "#d2a6ff"
plain = "#f3efe3"
punctuation = "#a3a3a3"
regex = "#95e6cb"
string = "#aad94c"
tag = "#39bae6"
type = "#59c2ff"
type_parameter = "#85d0ff"
type_system = "#39bae6"
variable = "#f3efe3"

# Zed and VS Code take ayu's own themes, swapping their backgrounds, text, and greys for this palette's, and any colour the contrast gate fails: an exact colour first, then a 6-digit one keeping its alpha.
[ports.vscode]
file = "ports/vscode/ayu-dark.json"

# Keys the recolour table can't reach, since their colour serves another role elsewhere, and ADR 0002's find borders, which ayu doesn't set.
[ports.vscode.colors]
"button.secondaryHoverBackground" = "ui.border_strong"
"descriptionForeground" = "ui.muted"
"editor.findMatchBorder" = "ui.find_active_border"
"editor.findMatchHighlightBorder" = "ui.find_border"
"editorOverviewRuler.findMatchForeground" = "ui.find_active_border"
"editorWhitespace.foreground" = "ui.invisible"
"list.invalidItemForeground" = "ui.quiet"
"minimap.findMatchHighlight" = "ui.find_active_border"
"panelTitle.inactiveForeground" = "ui.muted"
"tab.inactiveForeground" = "ui.muted"
"tab.unfocusedInactiveForeground" = "ui.muted"
"terminal.findMatchBackground" = "ui.find_terminal_active"
"terminal.findMatchHighlightBackground" = "ui.find_terminal"

[ports.vscode.recolour]
