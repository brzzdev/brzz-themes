name = "Islands Dark"
appearance = "dark"
# Half the dark tint, so JetBrains' keyword, string, and number colours keep 4.5:1 on diff and diagnostic fills unchanged: see docs/adr/0003-tinted-fills-behind-syntax.md.
tint_alpha = "1a"

[ui]
# JetBrains' blue-90, a step above its brand blue-80, lightened only as far as 4.5:1 on `panel` needs.
accent = "#548bfa"
accent_strong = "#71a1fe"
background = "#191a1c"
border = "#33353b"
border_strong = "#4c4f56"
border_variant = "#2f3136"
cursor = "#ced0d6"
# Between JetBrains' gray-30 and gray-40, about as far from `panel` as Geist Dark's element is from its panel.
element = "#2f3136"
error_fill = "#c54e58"
# JetBrains' text search fill `#114957` at 40%, and at 58% for the active match, the most at which code keeps 4.5:1.
find = "#162d34"
find_active = "#14353e"
find_active_border = "#72d6d6"
find_border = "#72d6d666"
find_terminal = "#0d667c40"
find_terminal_active = "#0586a340"
foreground = "#bcbec4"
# JetBrains' identifier-under-caret fill `#373b39` at 71%, the most at which code keeps 4.5:1.
highlight = "#2e3131"
hover = "#1f2024"
indent = "#323438"
indent_active = "#4e5157"
invisible = "#6f737a"
muted = "#9fa2a8"
# The main window around the editor, which Islands sets apart.
panel = "#26282c"
quiet = "#95989e"
# JetBrains' `#214283` at 56%, the most at which code keeps 4.5:1.
selection = "#1d3056"
selection_overlay = "#2142838f"
accents = ["#6396fa", "#a894f6", "#d59637", "#6aaea6", "#6db083", "#f57e84"]

[status]
conflict = "#df6b67"
created = "#73bd79"
# JetBrains marks deleted files and lines in grey.
deleted = "#8a8f96"
error = "#f57e84"
hidden = "#8a8f96"
hint = "#9499a0"
ignored = "#d69a6b"
info = "#6396fa"
modified = "#70aeff"
predictive = "#9398a3"
renamed = "#70aeff"
success = "#6db083"
unreachable = "#9499a0"
warning = "#d59637"

# black, red, green, yellow, blue, magenta, cyan, white
# Darcula's console colours, which Islands Dark inherits, with black lifted off the background, white kept a JetBrains step above bright black, and the rest lightened only as far as 4.5:1 needs.
[ansi]
normal = ["#33353b", "#f0524f", "#6da83f", "#b29624", "#469fe0", "#ba83d2", "#15a9a9", "#b1b1b1"]
bright = ["#828282", "#fc676a", "#4fc414", "#e5bf00", "#1fb0ff", "#ed7eed", "#00e5e5", "#ffffff"]

# The Islands Dark scheme, each colour lightened with its hue kept only as far as 4.5:1 needs. JetBrains leaves types, namespaces, and local variables in plain text.
[syntax]
attribute = "#b3ae60"
comment = "#9599a0"
comment_emphasized = "#7da189"
constant = "#ca7fbe"
function = "#56a8f5"
function_system = "#57aaf7"
keyword = "#cf8e6d"
link = "#6196fe"
literal = "#bcbec4"
namespace = "#bcbec4"
number = "#2aacb8"
plain = "#bcbec4"
punctuation = "#bcbec4"
regex = "#42c3d4"
string = "#6aab73"
tag = "#d5b778"
type = "#bcbec4"
type_parameter = "#16baac"
type_system = "#bcbec4"
variable = "#bcbec4"
